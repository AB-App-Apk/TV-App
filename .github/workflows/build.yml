name: Build APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Default to read-only access. Only the release-publishing job receives write permission.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      # PR validation uses no signing secrets or release keystore.
      - name: Run unit tests and debug compile smoke-check
        run: gradle :app:testDebugUnitTest :remote:testDebugUnitTest :app:assembleDebug :remote:assembleDebug --no-daemon

  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare signing key and build number
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEY_BASE64" || { echo "::error::Missing repository secret ANDROID_SIGNING_KEY_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing repository secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing repository secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing repository secret ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          chmod 600 release.keystore
          if ! keytool -list -keystore release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The signing keystore, store password, or alias is invalid."
            exit 1
          fi
          echo -n "$GITHUB_RUN_NUMBER" > version.txt
      - name: Build signed release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :remote:assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon
      - name: Remove signing key from runner
        if: always()
        run: rm -f release.keystore
      - name: Rename release APKs
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk TvDash.apk
          cp remote/build/outputs/apk/release/remote-release.apk TvRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            TvDash.apk
            TvRemote.apk
            version.txt
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist
      - name: Publish source-pinned build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }} (attempt ${{ github.run_attempt }})
          body: |
            Source commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            dist/TvDash.apk
            dist/TvRemote.apk
            dist/version.txt
      - name: Move stable download tag to this source commit
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
      - name: Publish stable download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          body: |
            Source commit: ${{ github.sha }}
            Versioned release: build-${{ github.run_number }}-${{ github.run_attempt }}
          files: |
            dist/TvDash.apk
            dist/TvRemote.apk
            dist/version.txt
