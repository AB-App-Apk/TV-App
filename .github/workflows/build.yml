name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Signing key and build number
        run: |
          base64 -d keystore.b64 > release.keystore
          echo -n "${{ github.run_number }}" > version.txt
      - name: Build debug APKs
        run: gradle :app:assembleDebug :remote:assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TvDash.apk
          cp remote/build/outputs/apk/debug/remote-debug.apk TvRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            TvDash.apk
            TvRemote.apk
      - name: Publish release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build ${{ github.run_number }}
          files: |
            TvDash.apk
            TvRemote.apk
            version.txt
