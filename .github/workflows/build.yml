name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare signing key and build number
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEY_BASE64" || { echo "::error::Missing repository secret ANDROID_SIGNING_KEY_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing repository secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing repository secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing repository secret ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          chmod 600 release.keystore
          if ! keytool -list -keystore release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The signing keystore, store password, or alias is invalid."
            exit 1
          fi
          echo -n "$GITHUB_RUN_NUMBER" > version.txt
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest :remote:testDebugUnitTest --no-daemon
      - name: Build debug APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleDebug :remote:assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon
      - name: Remove signing key from runner
        if: always()
        run: rm -f release.keystore
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TvDash.apk
          cp remote/build/outputs/apk/debug/remote-debug.apk TvRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            TvDash.apk
            TvRemote.apk
      - name: Publish release (stable download link)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build ${{ github.run_number }}
          files: |
            TvDash.apk
            TvRemote.apk
            version.txt
